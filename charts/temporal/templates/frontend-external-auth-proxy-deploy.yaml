apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "temporal.fullname" $ }}-frontend-proxy"
  labels:
    app: temporal-frontend-proxy
    component: proxy
    {{- include "temporal.resourceLabels" (list $ "" "") | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-frontend-proxy
  template:
    metadata:
      labels:
        app: temporal-frontend-proxy
        component: proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "temporal.fullname" $ }}-frontend-proxy-sa
      containers:
      - name: temporal-frontend-proxy
        image: {{ .Values.frontend-proxy.image.repository }}:{{ .Values.frontend-proxy.image.tag }}
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: PORT
          value: "8081"
        - name: TEMPORAL_FRONTEND_URL
          value: "http://{{ include "temporal.componentname" (list $ "frontend") }}.{{ $.Release.Namespace }}.svc.cluster.local:7233"
        - name: OIDC_ISSUER
          value: {{ .Values.frontend-proxy.issuer }}
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_CORS
          value: "true"
        - name: REQUEST_TIMEOUT
          value: "30s"
        - name: TOKEN_VALIDATION_TIMEOUT
          value: "5s"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL