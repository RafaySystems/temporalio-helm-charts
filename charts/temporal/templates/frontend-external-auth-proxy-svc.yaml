{{- if .Values.frontendproxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "temporal.fullname" $ }}-frontend-proxy"
  labels:
    app: temporal-frontend-proxy
    component: proxy
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: temporal-frontend-proxy
{{- end }}