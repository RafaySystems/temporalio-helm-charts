# Keycloak OIDC Configuration for Temporal Server
# Replace the placeholder values with your actual Keycloak configuration

server:
  config:
    authorization:
      jwtKeyProvider:
        # Keycloak JWKS endpoint - replace with your Keycloak server and realm
        keySourceURIs:
          - "https://your-keycloak-server/auth/realms/your-realm/protocol/openid-connect/certs"
        refreshInterval: 1m
      
      # Keycloak typically uses 'realm_access.roles' or custom claim names
      permissionsClaimName: realm_access.roles
      authorizer: default
      claimMapper: default

  # Keycloak-specific environment variables
  additionalEnv:
    - name: TEMPORAL_OIDC_ISSUER
      value: "https://your-keycloak-server/auth/realms/your-realm"
    - name: TEMPORAL_OIDC_AUDIENCE
      value: "temporal-client"
    - name: TEMPORAL_OIDC_CLIENT_ID
      value: "your-keycloak-client-id"

