# Auth0 OIDC Configuration for Temporal Server
# Replace the placeholder values with your actual Auth0 configuration

server:
  config:
    authorization:
      jwtKeyProvider:
        # Auth0 JWKS endpoint - replace with your Auth0 domain
        keySourceURIs:
          - "https://your-domain.auth0.com/.well-known/jwks.json"
        refreshInterval: 1m
      
      # Auth0 typically uses 'permissions' as the claim name
      permissionsClaimName: permissions
      authorizer: default
      claimMapper: default

  # Auth0-specific environment variables
  additionalEnv:
    - name: TEMPORAL_OIDC_ISSUER
      value: "https://your-domain.auth0.com/"
    - name: TEMPORAL_OIDC_AUDIENCE
      value: "https://your-temporal-api.com"
    - name: TEMPORAL_OIDC_CLIENT_ID
      value: "your-auth0-client-id"

