# Istio Path-Based Routing Configuration for Temporal
# Uses Istio Virtual Service instead of ingress for path-based routing

server:
  config:
    authorization:
      jwtKeyProvider:
        keySourceURIs:
          - "https://dex.your-domain.com/.well-known/jwks.json"
        refreshInterval: 1m
      permissionsClaimName: groups
      authorizer: default
      claimMapper: default

  # Disable ingress since we're using Istio Virtual Service
  frontend:
    service:
      type: ClusterIP
      port: 7233
      httpPort: 7243
    ingress:
      enabled: false  # Disable ingress, use Istio instead

web:
  enabled: true
  replicaCount: 1
  image:
    repository: temporalio/ui
    tag: 2.38.3
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false  # Disable ingress, use Istio instead
  
  # Web UI configuration for path-based routing
  additionalEnv:
    # Configure Web UI to work with path-based routing
    - name: TEMPORAL_UI_PUBLIC_PATH
      value: "/temporal"
    - name: TEMPORAL_UI_API_BASE_URL
      value: "/temporal"
    - name: TEMPORAL_UI_SERVER_API_BASE_URL
      value: "/temporal"
    - name: TEMPORAL_UI_SERVER_API_TIMEOUT
      value: "10000"
    # Optional: Configure authentication
    - name: TEMPORAL_AUTH_ENABLED
      value: "true"
    - name: TEMPORAL_AUTH_PROVIDER_URL
      value: "https://dex.your-domain.com"
    - name: TEMPORAL_AUTH_CLIENT_ID
      value: "temporal-web-ui"
    - name: TEMPORAL_AUTH_CALLBACK_URL
      value: "https://your-domain.com/temporal/auth/sso/callback"

# Istio Gateway and Virtual Service configurations
# These should be applied separately after deploying Temporal

---
# Istio Gateway for external access
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: temporal-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - your-domain.com
    # Redirect HTTP to HTTPS
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: your-domain-tls
    hosts:
    - your-domain.com

---
# Istio Virtual Service for path-based routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: temporal-path-routing
  namespace: default
spec:
  hosts:
  - your-domain.com
  gateways:
  - temporal-gateway
  http:
  # Temporal API routes
  - match:
    - uri:
        prefix: /temporal/api
    route:
    - destination:
        host: temporal-frontend
        port:
          number: 7233
    rewrite:
      uri: /
    corsPolicy:
      allowOrigins:
      - exact: https://your-domain.com
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - "DNT"
      - "User-Agent"
      - "X-Requested-With"
      - "If-Modified-Since"
      - "Cache-Control"
      - "Content-Type"
      - "Range"
      - "Authorization"
  
  # Temporal Web UI routes
  - match:
    - uri:
        prefix: /temporal
    route:
    - destination:
        host: temporal-web
        port:
          number: 8080
    rewrite:
      uri: /
    corsPolicy:
      allowOrigins:
      - exact: https://your-domain.com
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - "DNT"
      - "User-Agent"
      - "X-Requested-With"
      - "If-Modified-Since"
      - "Cache-Control"
      - "Content-Type"
      - "Range"
      - "Authorization"

---
# Alternative: More granular routing with different paths
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: temporal-granular-routing
  namespace: default
spec:
  hosts:
  - your-domain.com
  gateways:
  - temporal-gateway
  http:
  # Temporal API - gRPC
  - match:
    - uri:
        prefix: /temporal/grpc
    route:
    - destination:
        host: temporal-frontend
        port:
          number: 7233
    rewrite:
      uri: /
  
  # Temporal API - HTTP
  - match:
    - uri:
        prefix: /temporal/http
    route:
    - destination:
        host: temporal-frontend
        port:
          number: 7243
    rewrite:
      uri: /
  
  # Temporal Web UI
  - match:
    - uri:
        prefix: /temporal/ui
    route:
    - destination:
        host: temporal-web
        port:
          number: 8080
    rewrite:
      uri: /
  
  # Temporal Web UI - alternative path
  - match:
    - uri:
        prefix: /workflows
    route:
    - destination:
        host: temporal-web
        port:
          number: 8080
    rewrite:
      uri: /

---
# Example: Multiple domain support
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: temporal-multi-domain
  namespace: default
spec:
  hosts:
  - temporal.your-domain.com
  - workflows.your-domain.com
  - your-domain.com
  gateways:
  - temporal-gateway
  http:
  - match:
    - authority:
        prefix: temporal.your-domain.com
    route:
    - destination:
        host: temporal-frontend
        port:
          number: 7233
    rewrite:
      uri: /
  - match:
    - authority:
        prefix: workflows.your-domain.com
    route:
    - destination:
        host: temporal-web
        port:
          number: 8080
    rewrite:
      uri: /
  - match:
    - uri:
        prefix: /temporal
    route:
    - destination:
        host: temporal-web
        port:
          number: 8080
    rewrite:
      uri: /

---
# Example: Traffic splitting and canary deployments
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: temporal-canary
  namespace: default
spec:
  hosts:
  - your-domain.com
  gateways:
  - temporal-gateway
  http:
  - match:
    - uri:
        prefix: /temporal
      headers:
        x-canary:
          exact: "true"
    route:
    - destination:
        host: temporal-web-canary
        port:
          number: 8080
      weight: 10
    - destination:
        host: temporal-web
        port:
          number: 8080
      weight: 90
    rewrite:
      uri: /

---
# Example: Authentication and authorization with Istio
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: temporal-auth-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: temporal-frontend
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/temporal-worker-sa"]
    to:
    - operation:
        methods: ["POST"]
        paths: ["/temporal.api.workflowservice.v1.WorkflowService/*"]

---
# Example: Rate limiting with Istio
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: temporal-rate-limit
  namespace: default
spec:
  workloadSelector:
    labels:
      app: temporal-frontend
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.ratelimit
        typed_config:
          "@type": type.googleapis.com/udpa.type.v1.TypedStruct
          type_url: type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
          value:
            domain: temporal
            rate_limit_service:
              grpc_service:
                envoy_grpc:
                  cluster_name: rate_limit_cluster 