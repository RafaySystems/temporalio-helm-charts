# Production OIDC Configuration for Temporal Server - Rafay Dex
# Properly configured for internal service communication and external OIDC auth

server:
  config:
    authorization:
      jwtKeyProvider:
        # Rafay Dex JWKS endpoint
        keySourceURIs:
          - "https://console.gaap.dev.rafay-edge.net/dex/keys"
        refreshInterval: 1m
      
      # Dex permissions configuration
      permissionsClaimName: groups
      authorizer: default
      claimMapper: default
      
      # Configure authorization for different service types
      # This allows internal services to communicate while requiring OIDC for external clients
      systemAuthorizer:
        # Allow system workflows and internal services
        systemWorkflows:
          - "temporal-sys-tq-scanner-workflow"
          - "temporal-sys-history-scanner-workflow"
          - "temporal-sys-workflow-mapper-workflow"
          - "temporal-sys-archival-workflow"
        # Allow internal service communication
        internalServices:
          - "temporal-frontend"
          - "temporal-history"
          - "temporal-matching"
          - "temporal-worker"
        # Require OIDC for external clients
        externalClients:
          requireAuth: true
          allowedAudiences:
            - "temporal-client"
            - "temporal-worker"
            - "temporal-web-ui"

  # Environment variables for OIDC configuration
  additionalEnv:
    - name: TEMPORAL_OIDC_ISSUER
      value: "https://console.gaap.dev.rafay-edge.net/dex"
    - name: TEMPORAL_OIDC_AUDIENCE
      value: "temporal-client"
    - name: TEMPORAL_OIDC_CLIENT_ID
      value: "temporal-client"
    
    # Internal service configuration
    - name: TEMPORAL_INTERNAL_SERVICE_AUTH_ENABLED
      value: "false"  # Disable OIDC for internal services
    - name: TEMPORAL_SYSTEM_WORKFLOW_AUTH_ENABLED
      value: "false"  # Disable OIDC for system workflows
    - name: TEMPORAL_ALLOW_INTERNAL_SERVICE_COMMUNICATION
      value: "true"

  # Disable ingress since we're using Istio Virtual Service
  frontend:
    service:
      type: ClusterIP
      port: 7233
      httpPort: 7243
    ingress:
      enabled: false  # Disable ingress, use Istio instead
    
    # Frontend service - requires OIDC for external clients
    additionalEnv:
      - name: TEMPORAL_FRONTEND_REQUIRE_AUTH
        value: "true"
      - name: TEMPORAL_FRONTEND_ALLOW_INTERNAL_SERVICES
        value: "true"

  # Internal services - no OIDC required for internal communication
  history:
    additionalEnv:
      - name: TEMPORAL_INTERNAL_SERVICE_AUTH_ENABLED
        value: "false"
      - name: TEMPORAL_SYSTEM_WORKFLOW_AUTH_ENABLED
        value: "false"
  
  matching:
    additionalEnv:
      - name: TEMPORAL_INTERNAL_SERVICE_AUTH_ENABLED
        value: "false"
      - name: TEMPORAL_SYSTEM_WORKFLOW_AUTH_ENABLED
        value: "false"
  
  worker:
    additionalEnv:
      - name: TEMPORAL_INTERNAL_SERVICE_AUTH_ENABLED
        value: "false"
      - name: TEMPORAL_SYSTEM_WORKFLOW_AUTH_ENABLED
        value: "false"
      - name: TEMPORAL_WORKER_SKIP_AUTH
        value: "true"

web:
  enabled: true
  replicaCount: 1
  image:
    repository: temporalio/ui
    tag: 2.38.3
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false  # Disable ingress, use Istio instead
  
  # Web UI configuration for path-based routing with OIDC
  additionalEnv:
    # Configure Web UI to work with path-based routing
    - name: TEMPORAL_UI_PUBLIC_PATH
      value: "/temporal"
    - name: TEMPORAL_UI_API_BASE_URL
      value: "/temporal"
    - name: TEMPORAL_UI_SERVER_API_BASE_URL
      value: "/temporal"
    - name: TEMPORAL_UI_SERVER_API_TIMEOUT
      value: "10000"
    
    # OIDC authentication for Web UI
    - name: TEMPORAL_AUTH_ENABLED
      value: "true"
    - name: TEMPORAL_AUTH_PROVIDER_URL
      value: "https://console.gaap.dev.rafay-edge.net/dex"
    - name: TEMPORAL_AUTH_CLIENT_ID
      value: "temporal-web-ui"
    - name: TEMPORAL_AUTH_CALLBACK_URL
      value: "https://ops-console.gaap.dev.rafay-edge.net/temporal/auth/sso/callback"
    - name: TEMPORAL_AUTH_SCOPES
      value: "openid profile email groups"

# Service Account for internal services
serviceAccount:
  create: true
  name: temporal-internal-sa
  extraAnnotations:
    # Allow internal services to communicate without OIDC
    temporal.io/internal-service: "true"
    temporal.io/skip-auth: "true"

# Worker configuration with OIDC support
# This allows external workers to authenticate with OIDC tokens
worker:
  enabled: false  # Disable default worker, use external workers with OIDC
  additionalEnv:
    - name: TEMPORAL_WORKER_OIDC_ENABLED
      value: "true"
    - name: TEMPORAL_WORKER_OIDC_ISSUER
      value: "https://console.gaap.dev.rafay-edge.net/dex"
    - name: TEMPORAL_WORKER_OIDC_AUDIENCE
      value: "temporal-worker"
    - name: TEMPORAL_WORKER_OIDC_CLIENT_ID
      value: "temporal-worker"

