# Monitoring and metrics for OIDC
server:
  metrics:
    tags:
      oidc_enabled: "true"
      oidc_provider: "rafay-dex"
      environment: "production"
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        monitoring: temporal-oidc

# Security configuration
server:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

