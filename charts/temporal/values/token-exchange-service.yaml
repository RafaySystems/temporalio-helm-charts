# Token Exchange Service for Multi-Cluster OIDC
# This service handles token exchange between clusters for Temporal workers

---
apiVersion: v1
kind: Namespace
metadata:
  name: token-exchange-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-exchange-sa
  namespace: token-exchange-system
---
apiVersion: v1
kind: Secret
metadata:
  name: token-exchange-secret
  namespace: token-exchange-system
type: Opaque
data:
  client_secret: <base64-encoded-secret>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-exchange-service
  namespace: token-exchange-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: token-exchange-service
  template:
    metadata:
      labels:
        app: token-exchange-service
    spec:
      serviceAccountName: token-exchange-sa
      containers:
      - name: token-exchange
        image: your-token-exchange-image:latest
        ports:
        - containerPort: 8080
        env:
        - name: DEX_ISSUER
          value: "https://dex.your-domain.com"
        - name: DEX_CLIENT_ID
          value: "token-exchange-service"
        - name: DEX_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: token-exchange-secret
              key: client_secret
        - name: TEMPORAL_SERVER_ADDRESS
          value: "temporal-frontend.temporal-system.svc.cluster.local:7233"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: token-exchange-service
  namespace: token-exchange-system
spec:
  selector:
    app: token-exchange-service
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: token-exchange-network-policy
  namespace: token-exchange-system
spec:
  podSelector:
    matchLabels:
      app: token-exchange-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: worker-system
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: dex-system
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          name: temporal-system
    ports:
    - protocol: TCP
      port: 7233
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-exchange-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: token-exchange-role-binding
subjects:
- kind: ServiceAccount
  name: token-exchange-sa
  namespace: token-exchange-system
roleRef:
  kind: ClusterRole
  name: token-exchange-role
  apiGroup: rbac.authorization.k8s.io 