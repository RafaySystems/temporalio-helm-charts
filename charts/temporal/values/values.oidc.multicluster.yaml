# Multi-Cluster OIDC Configuration for Temporal Server
# Dex and Temporal Server in Cluster A, Workers in Cluster B
# Uses token exchange for cross-cluster authentication

server:
  config:
    authorization:
      jwtKeyProvider:
        # Dex JWKS endpoint in the same cluster as Temporal
        keySourceURIs:
          - "https://dex.temporal-cluster.svc.cluster.local/.well-known/jwks.json"
          # External Dex endpoint (if accessible)
          - "https://dex.your-domain.com/.well-known/jwks.json"
        refreshInterval: 1m
      
      # Dex typically uses 'groups' for permissions
      permissionsClaimName: groups
      authorizer: default
      claimMapper: default

  # Multi-cluster environment variables
  additionalEnv:
    - name: TEMPORAL_OIDC_ISSUER
      value: "https://dex.your-domain.com"
    - name: TEMPORAL_OIDC_AUDIENCE
      value: "temporal-multicluster"
    - name: TEMPORAL_OIDC_CLIENT_ID
      value: "temporal-server"
    
    # Cross-cluster communication settings
    - name: TEMPORAL_CROSS_CLUSTER_ENABLED
      value: "true"
    - name: TEMPORAL_WORKER_CLUSTER_ID
      value: "worker-cluster"

