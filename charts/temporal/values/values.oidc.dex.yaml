# Dex OIDC Configuration for Temporal Server
# Replace the placeholder values with your actual Dex configuration

server:
  config:
    authorization:
      jwtKeyProvider:
        # Dex JWKS endpoint - replace with your Dex server URL
        keySourceURIs:
          - "https://your-dex-server/.well-known/jwks.json"
        refreshInterval: 1m
      
      # Dex typically uses 'groups' or custom claim names for permissions
      permissionsClaimName: groups
      authorizer: default
      claimMapper: default

  # Dex-specific environment variables
  additionalEnv:
    - name: TEMPORAL_OIDC_ISSUER
      value: "https://your-dex-server"
    - name: TEMPORAL_OIDC_AUDIENCE
      value: "temporal-client"
    - name: TEMPORAL_OIDC_CLIENT_ID
      value: "your-dex-client-id"

