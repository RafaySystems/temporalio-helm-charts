# Test Dex OIDC Configuration for Temporal Server
# Use this configuration to test Dex OIDC setup

server:
  config:
    # Enable debug logging for Dex OIDC troubleshooting
    logLevel: "debug,info"
    
    authorization:
      jwtKeyProvider:
        # Test Dex JWKS endpoint - replace with your actual Dex server
        keySourceURIs:
          - "https://dex.your-domain.com/.well-known/jwks.json"
          # For local Dex testing
          # - "http://localhost:5556/.well-known/jwks.json"
        refreshInterval: 30s  # Shorter interval for testing
        
        # Optional: HTTP client configuration for testing
        httpClient:
          timeout: 10s
          maxIdleConns: 5
          maxIdleConnsPerHost: 2
          idleConnTimeout: 30s
          tlsHandshakeTimeout: 5s
          expectContinueTimeout: 1s
      
      # Dex typically uses 'groups' for permissions
      permissionsClaimName: groups
      authorizer: default
      claimMapper: default

  # Test environment variables for Dex
  additionalEnv:
    - name: TEMPORAL_OIDC_ISSUER
      value: "https://dex.your-domain.com"
    - name: TEMPORAL_OIDC_AUDIENCE
      value: "temporal-client"
    - name: TEMPORAL_OIDC_CLIENT_ID
      value: "temporal-client"
    
    # Debug environment variables
    - name: TEMPORAL_DEBUG_OIDC
      value: "true"
    - name: TEMPORAL_LOG_LEVEL
      value: "debug"

  # Test metrics configuration
  metrics:
    tags:
      oidc_enabled: "true"
      oidc_provider: "dex"
      environment: "test"

# Test worker configuration with Dex
server:
  worker:
    additionalEnv:
      - name: TEMPORAL_WORKER_DEX_TOKEN
        value: "test-dex-jwt-token"
      - name: TEMPORAL_WORKER_DEBUG
        value: "true"

