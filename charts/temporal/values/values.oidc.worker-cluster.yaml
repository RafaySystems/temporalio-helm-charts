# Worker Cluster OIDC Configuration
# Workers in Cluster B connecting to Temporal Server in Cluster A
# Uses token exchange and cross-cluster authentication

# Note: This is not a complete Temporal server configuration
# This file shows the worker-side configuration needed for cross-cluster OIDC

# Worker Application Configuration (not Temporal server)
# This would be used in your worker application deployment

workerConfig:
  # Temporal server connection details (in the other cluster)
  temporal:
    serverAddress: "temporal-frontend.temporal-cluster.svc.cluster.local:7233"
    # Or external endpoint
    # serverAddress: "temporal.your-domain.com:7233"
    
    # OIDC configuration for worker authentication
    oidc:
      issuer: "https://dex.your-domain.com"
      audience: "temporal-multicluster"
      clientId: "temporal-worker"
      
      # Token exchange configuration
      tokenExchange:
        enabled: true
        endpoint: "https://token-exchange.temporal-cluster.svc.cluster.local"
        clientId: "temporal-worker-token-exchange"
        clientSecret:
          secretName: "worker-token-exchange-secret"
          secretKey: "client_secret"
      
      # Worker-specific claims
      claims:
        permissionsClaimName: "groups"
        workerIdClaimName: "sub"
        clusterIdClaimName: "cluster_id"

