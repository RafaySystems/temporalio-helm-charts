# Dex External Worker Client Configuration
# This should be added to your Dex configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: dex-system
data:
  config.yaml: |
    issuer: https://console.gaap.dev.rafay-edge.net/dex
    
    storage:
      type: kubernetes
      config:
        inCluster: true
    
    web:
      http: 0.0.0.0:5556
      https: 0.0.0.0:5554
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
    
    # Static clients configuration
    staticClients:
      # Existing temporal-server client
      - id: temporal-server
        secret: temporal-server-secret
        name: "Temporal Server"
        redirectURIs:
          - "https://ops-console.gaap.dev.rafay-edge.net/temporal/auth/sso/callback"
        trustedPeers:
          - external-worker-client
      
      # New external worker client
      - id: external-worker-client
        secret: external-worker-secret-123  # Change this to a secure secret
        name: "External Worker Client"
        redirectURIs:
          - "urn:ietf:wg:oauth:2.0:oob"  # For client credentials flow
        trustedPeers:
          - temporal-server
        public: false
        logoURL: ""
    
    # Static passwords for testing (remove in production)
    staticPasswords:
      - email: "admin@example.com"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # "password"
        username: "admin"
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
    
    # Static connectors (if using external identity providers)
    connectors:
      - type: mockCallback
        id: mock
        name: "Example"
    
    # OAuth2 configuration
    oauth2:
      skipApprovalScreen: true
      alwaysShowLoginScreen: false
    
    # Expiry configuration
    expiry:
      signingKeys: "6h"
      idTokens: "24h"
      authRequests: "5m"
      deviceRequests: "5m"
      refreshTokens:
        reuseInterval: "5s"
        absoluteLifetime: "720h"
        validIfNotUsedFor: "2160h"
        useRefreshTokenRotation: true
        rotateRefreshTokenReuseInterval: "10s"
    
    # Logger configuration
    logger:
      level: "debug"
      format: "json" 