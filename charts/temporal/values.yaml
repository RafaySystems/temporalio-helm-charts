web:
  # additionalInitContainers: []
  enabled: true
  replicaCount: 1
  image:
    repository: temporalio/ui
    tag: 2.38.3
    pullPolicy: IfNotPresent
  service:
    # set type to NodePort if access to web needs access from outside the cluster
    # for more info see https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # The below clusterIP setting can be set to "None" to make the temporal-web service headless.
    # Note that this requires the web.service.type to be the default ClusterIP value.
    # clusterIP:
    port: 8080
    annotations: {}
    # loadBalancerIP:
  ingress:
    enabled: false
    # className:
    annotations: {}
    # kubernetes.io/ingress.class: traefik
    # ingress.kubernetes.io/ssl-redirect: "false"
    # traefik.frontend.rule.type: PathPrefix
    hosts:
      - "/"
      # - "domain.com/xyz"
      # - "domain.com"
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  deploymentLabels: {}
  deploymentAnnotations: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  additionalVolumes: []
  additionalVolumeMounts: []
  # Adjust Web UI config with environment variables:
  # https://docs.temporal.io/references/web-ui-environment-variables
  additionalEnv:
    - name: TEMPORAL_UI_PUBLIC_PATH
      value: "/temporalui"
    - name: TEMPORAL_UI_API_BASE_URL
      value: "/temporal"
    - name: TEMPORAL_UI_SERVER_API_BASE_URL
      value: "/temporalui"
    - name: TEMPORAL_UI_SERVER_API_TIMEOUT
      value: "10000"
    # Disable authentication for web UI to match backend configuration
    - name: TEMPORAL_AUTH_ENABLED
      value: "true"
    # Remove OIDC configuration since backend auth is disabled
    - name: TEMPORAL_AUTH_PROVIDER_URL
      value: "https://console.gaap.dev.rafay-edge.net/dex"
    - name: TEMPORAL_AUTH_CLIENT_ID
      value: "temporal-web-ui"
    - name: TEMPORAL_AUTH_CLIENT_SECRET
      value: "temporal-web-ui-secret"
    - name: TEMPORAL_AUTH_CALLBACK_URL
      value: "https://ops-console.gaap.dev.rafay-edge.net/temporalui/auth/sso/callback"
    - name: TEMPORAL_AUTH_SCOPES
      value: "openid profile email groups"
  additionalEnvSecretName: ""
  containerSecurityContext: {}
  securityContext: {}
  topologySpreadConstraints: []
  podDisruptionBudget: {}
